# gost v3 proxy configuration with embedded greyproxy
#
# Runs both HTTP and SOCKS5 proxies with ACL logic provided
# by greyproxy's built-in Go plugins (no external server).
#
# NOTE: This is a template file. The actual gost.yaml is generated
# by entrypoint-gost.sh which adds custom hosts from PROXY_CUSTOM_HOSTS.

log:
  level: info
  format: json
  output: stdout

# greyproxy: embedded management UI + REST API + plugins
# The auther/admission/bypass/resolver names below must match
# the names referenced by services.
greyproxy:
  addr: ":43080"
  pathPrefix: /
  auther: auther-0
  admission: admission-0
  bypass: bypass-0
  resolver: resolver-0
  notifications:
    enabled: true


services:
  # HTTP/HTTPS proxy on port 3128 (backward compatible with Squid)
  - name: http-proxy
    addr: ":43051"
    handler:
      type: http
      auther: auther-0
      metadata:
        sniffing: true
        sniffing.websocket: true
    listener:
      type: tcp
    admission: admission-0
    bypass: bypass-0
    resolver: resolver-0
    hosts: hosts-0

  # SOCKS5 proxy on port 1080 (for protocols like IMAP)
  - name: socks5-proxy
    addr: ":43052"
    handler:
      type: socks5
      auther: auther-0
      metadata:
        sniffing: true
        sniffing.websocket: true
    listener:
      type: tcp
    admission: admission-0
    bypass: bypass-0
    resolver: resolver-0
    hosts: hosts-0

  # DNS proxy on port 53 (UDP + TCP)
  #
  # Upstream resolver: greyproxy auto-detects the system DNS at startup
  # (/etc/resolv.conf on Linux/macOS, registry on Windows) and injects it as
  # the forwarder. Falls back to 1.1.1.1:53 if detection fails.
  #
  # To use a specific upstream instead, add a forwarder block to either or both
  # services below and greyproxy will leave it untouched:
  #
  #   forwarder:
  #     nodes:
  #       - name: dns-upstream
  #         addr: 9.9.9.9:53
  - name: dns-proxy-udp
    addr: :43053
    handler:
      type: dns
    listener:
      type: dns
      metadata:
        mode: udp
    resolver: resolver-0

  - name: dns-proxy-tcp
    addr: :43053
    handler:
      type: dns
    listener:
      type: tcp
    resolver: resolver-0

  # LLM proxy on port 43054 (OpenAI-compatible at root; other dialects
  # under /<provider>/, e.g. /anthropic/v1/messages — see docs).
  #
  # Bound to 127.0.0.1 by default because it holds upstream API keys —
  # change to ":43054" only if you need network-wide access.
  - name: llm-proxy
    addr: 127.0.0.1:43054
    handler:
      type: llmproxy
      metadata:
        # Optional inbound bearer-token auth. Off by default for local dev.
        auth.require: false
        auth.keys: []
    listener:
      type: tcp

# LLM proxy seed (providers + aliases). Inserted into the database only
# on first start; after that, the database is authoritative and you edit
# via the dashboard /api/llm/* endpoints. Changing this block later has
# no effect unless the llm_providers/llm_aliases tables are empty.
#
# api_key accepts a literal value or `env:NAME` to read from the process
# environment at seed time. A provider whose env var is unset is created
# without a key (fine for local backends like Ollama).
llm:
  providers:
    - name: openai-cloud
      type: openai
      base_url: https://api.openai.com
      api_key: env:OPENAI_API_KEY

    - name: openrouter
      type: openrouter
      base_url: https://openrouter.ai/api/v1
      api_key: env:OPENROUTER_API_KEY

    # Any OpenAI-compatible local endpoint (Ollama, LM Studio, vLLM, …).
    - name: ollama
      type: openai-compat
      base_url: http://localhost:11434/v1

  # Aliases are the public model names clients send. Point them at any
  # provider/model. Switching a backend is a one-line change here (or a
  # click in the dashboard) with no agent reconfiguration.
  models:
    - name: fast
      target: openai-cloud/gpt-4o-mini

    - name: smart
      target: openai-cloud/gpt-4o

    - name: local
      target: ollama/llama3.2

# Static host mappings
hosts:
  - name: hosts-0
    mappings:
      - ip: 127.0.0.1
        hostname: localhost
      - ip: "::1"
        hostname: localhost
