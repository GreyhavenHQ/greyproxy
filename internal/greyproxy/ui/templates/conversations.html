{{define "head"}}
<!-- Marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
    .conv-markdown h1, .conv-markdown h2, .conv-markdown h3, .conv-markdown h4 {
        font-weight: 600;
        margin-top: 0.75em;
        margin-bottom: 0.25em;
        line-height: 1.4;
    }
    .conv-markdown h1 { font-size: 1.1em; }
    .conv-markdown h2 { font-size: 1em; }
    .conv-markdown h3 { font-size: 0.95em; }
    .conv-markdown p { margin: 0.35em 0; }
    .conv-markdown ul { margin: 0.35em 0; padding-left: 1.5em; list-style-type: disc; }
    .conv-markdown ol { margin: 0.35em 0; padding-left: 1.5em; list-style-type: decimal; }
    .conv-markdown li { margin: 0.15em 0; }
    .conv-markdown code {
        background: rgb(var(--color-muted));
        padding: 0.1em 0.35em;
        border-radius: 3px;
        font-size: 0.9em;
    }
    .conv-markdown pre {
        background: rgb(var(--color-muted));
        padding: 0.5em 0.75em;
        border-radius: 4px;
        overflow-x: auto;
        margin: 0.5em 0;
    }
    .conv-markdown pre code {
        background: none;
        padding: 0;
    }
    .conv-markdown blockquote {
        border-left: 3px solid rgb(var(--color-border));
        padding-left: 0.75em;
        margin: 0.5em 0;
        color: rgb(var(--color-muted-foreground));
    }
    .conv-markdown a { color: rgb(var(--color-primary)); text-decoration: underline; }
    .conv-markdown table { border-collapse: collapse; margin: 0.5em 0; }
    .conv-markdown th, .conv-markdown td { border: 1px solid rgb(var(--color-border)); padding: 0.25em 0.5em; font-size: 0.9em; }
    .conv-markdown > *:first-child { margin-top: 0; }
    .conv-markdown > *:last-child { margin-bottom: 0; }
    /* Tool call cards */
    .tool-call-card { transition: border-color 0.15s; }
    .tool-call-card[data-tool-expanded="true"] { border-color: rgb(var(--color-border)); }
    .tool-call-header:hover { background: rgb(var(--color-muted) / 0.5); }
    .tool-call-chevron { transition: transform 0.15s; }
</style>
{{end}}

{{define "content"}}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-foreground">Conversations</h1>
        <button id="conv-live-btn" onclick="toggleConvLive()" type="button"
            class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md transition-colors">
            <span id="conv-live-dot" class="relative flex h-2.5 w-2.5 overflow-hidden">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-500 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
            </span>
            <span id="conv-live-text">Live</span>
            <span id="conv-pending-badge" class="hidden ml-0.5 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none rounded-full min-w-[1.25rem]"></span>
        </button>
    </div>

    <div class="flex gap-4" style="height: calc(100vh - 12rem);">
        <!-- Sidebar: conversation list -->
        <div class="w-80 flex-shrink-0 flex flex-col bg-card rounded-lg shadow-sm border border-border overflow-hidden">
            <!-- Filters -->
            <div class="p-3 border-b border-border">
                <form id="conv-filter-form" class="space-y-2">
                    <div>
                        <select id="conv-container" name="container"
                            onchange="refreshConversations()"
                            class="block w-full pl-2 pr-8 py-1.5 text-xs border-border focus:outline-none focus:ring-ring focus:border-ring rounded-md bg-background">
                            <option value="">All Sources</option>
                            {{range .Containers}}<option value="{{.}}">{{.}}</option>{{end}}
                        </select>
                    </div>
                </form>
            </div>
            <!-- Conversation list -->
            <div id="conv-list" class="flex-1 overflow-y-auto">
                <div class="flex justify-center py-8">
                    <div class="inline-block w-6 h-6 border-3 border-primary border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>

        <!-- Main: conversation detail -->
        <div class="flex-1 bg-card rounded-lg shadow-sm border border-border overflow-hidden flex flex-col">
            <div id="conv-detail" class="flex-1 overflow-y-auto p-6">
                <div class="flex items-center justify-center h-full text-muted-foreground">
                    <div class="text-center">
                        <svg class="mx-auto h-12 w-12 text-muted-foreground/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <p class="mt-2 text-sm">Select a conversation to view details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var currentConvId = null;
var convLive = true;
var convPendingCount = 0;

function applyConvLiveStyle() {
    var btn = document.getElementById('conv-live-btn');
    var text = document.getElementById('conv-live-text');
    var badge = document.getElementById('conv-pending-badge');
    var dot = document.getElementById('conv-live-dot');
    if (convLive) {
        btn.className = 'inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md text-foreground hover:bg-muted transition-colors';
        text.textContent = 'Live';
        badge.classList.add('hidden');
        dot.innerHTML = '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-500 opacity-75"></span>'
                      + '<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>';
    } else {
        btn.className = 'inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md text-muted-foreground hover:bg-muted transition-colors';
        dot.innerHTML = '<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-muted-foreground/50"></span>';
        if (convPendingCount > 0) {
            text.textContent = 'Paused';
            badge.textContent = convPendingCount;
            badge.className = 'ml-0.5 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-primary-foreground bg-primary rounded-full min-w-[1.25rem]';
        } else {
            text.textContent = 'Paused';
            badge.classList.add('hidden');
        }
    }
}

function toggleConvLive() {
    convLive = !convLive;
    if (convLive && convPendingCount > 0) {
        convPendingCount = 0;
        refreshConversations();
    }
    applyConvLiveStyle();
}

function refreshConversations() {
    var listEl = document.getElementById('conv-list');
    var scrollTop = listEl.scrollTop;
    var container = document.getElementById('conv-container').value;
    var url = '{{.Prefix}}/htmx/conversation-list?container=' + encodeURIComponent(container);
    fetch(url).then(function(r) { return r.text(); }).then(function(html) {
        listEl.innerHTML = html;
        listEl.scrollTop = scrollTop;
        // Re-highlight current selection if any
        if (currentConvId) {
            document.querySelectorAll('[data-conv-id]').forEach(function(el) {
                el.classList.toggle('bg-muted', el.dataset.convId === currentConvId);
            });
        }
    });
}

function renderMarkdown() {
    if (typeof marked !== 'undefined') {
        document.querySelectorAll('#conv-detail .conv-markdown').forEach(function(el) {
            el.innerHTML = marked.parse(el.textContent);
        });
    }
}

function selectConversation(id) {
    currentConvId = id;
    // Update URL without reload
    var url = new URL(window.location);
    url.searchParams.set('id', id);
    history.pushState({convId: id}, '', url);
    // Highlight selected
    document.querySelectorAll('[data-conv-id]').forEach(function(el) {
        el.classList.toggle('bg-muted', el.dataset.convId === id);
    });
    // Load detail
    var detailUrl = '{{.Prefix}}/htmx/conversation-detail?id=' + encodeURIComponent(id);
    fetch(detailUrl).then(function(r) { return r.text(); }).then(function(html) {
        var el = document.getElementById('conv-detail');
        el.innerHTML = html;
        el.scrollTop = 0;
        renderMarkdown();
        renderConvFsEvents();
    });
}

// renderConvFsEvents loads the filesystem events the correlator
// attributed to transactions in this conversation and renders them at
// the bottom of the detail pane. Lives here (not in the partial)
// because innerHTML swap doesn't execute <script> tags inside the
// inserted HTML, so the loader has to be defined where it can be
// referenced after the swap. Groups events by transaction id so the
// timeline matches the conversation's call sequence.
function renderConvFsEvents() {
    var wrap = document.getElementById('conv-fsevents-wrap');
    if (!wrap) return;
    var convID = wrap.getAttribute('data-conv-id') || '';
    var prefix = wrap.getAttribute('data-prefix') || '';
    if (!convID) return;
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function opColor(op) {
        switch (op) {
            case 'open_read':  return 'text-blue-600 dark:text-blue-400';
            case 'open_write':
            case 'create':     return 'text-green-600 dark:text-green-400';
            case 'unlink':     return 'text-red-600 dark:text-red-400';
            case 'rename':
            case 'link':
            case 'symlink':    return 'text-amber-600 dark:text-amber-400';
            case 'mkdir':      return 'text-purple-600 dark:text-purple-400';
            case 'exec':       return 'text-indigo-600 dark:text-indigo-400';
            default:           return 'text-muted-foreground';
        }
    }
    function exeChip(exe) {
        if (!exe) return '';
        var slash = exe.lastIndexOf('/');
        var base = slash >= 0 ? exe.substring(slash + 1) : exe;
        return ' <span class="inline-flex items-center px-1 rounded text-[10px] bg-background border border-border ml-1 align-middle text-muted-foreground" title="' + esc(exe) + '">' + esc(base) + '</span>';
    }
    // Render a single event line. Shared between the per-turn inline
    // panels and the bottom "all events" panel so the format stays
    // identical and a path I can read in one place reads the same in
    // the other.
    function renderFsLine(e) {
        var op = esc(e.op || '');
        var path = esc(e.path || '');
        var extra = '';
        if (e.path2) extra += ' &rarr; ' + esc(e.path2);
        if (e.pid) extra += ' <span class="text-muted-foreground">pid=' + e.pid + '</span>';
        extra += exeChip(e.exe);
        var ts = e.ts ? '<span class="text-muted-foreground">' + esc(e.ts.substr(11, 12)) + '</span> ' : '';
        return '<div class="truncate">' + ts + '<span class="' + opColor(e.op) + ' font-semibold">' + op + '</span> ' + path + extra + '</div>';
    }

    // Bucket events by coarse op category and return per-bucket
    // counts plus the most frequently touched paths in each bucket.
    // The buckets match the color / intensity scheme used by the
    // header badge below so a single pass over the events feeds both
    // the inline summary line and the badge.
    function bucketizeFsEvents(events) {
        var b = {
            read:   { count: 0, paths: {} },
            write:  { count: 0, paths: {} }, // includes create
            del:    { count: 0, paths: {} },
            exec:   { count: 0, paths: {} },
            other:  { count: 0, paths: {} },
        };
        function bump(slot, path) {
            slot.count++;
            if (path) slot.paths[path] = (slot.paths[path] || 0) + 1;
        }
        events.forEach(function(e) {
            switch (e.op) {
                case 'open_read':                       bump(b.read,  e.path); break;
                case 'open_write': case 'create':       bump(b.write, e.path); break;
                case 'unlink':                          bump(b.del,   e.path); break;
                case 'exec':                            bump(b.exec,  e.path); break;
                default:                                bump(b.other, e.path); break;
            }
        });
        return b;
    }

    // Pick the N most frequently touched basenames from a bucket so
    // the preview line can name the substance of the activity. We use
    // basenames (not full paths) because the preview must fit on one
    // line; the full paths are visible in the expanded drill-down.
    function topBasenames(slot, n) {
        var entries = Object.keys(slot.paths).map(function(p) {
            return { p: p, n: slot.paths[p] };
        });
        entries.sort(function(a, b) { return b.n - a.n; });
        var out = [];
        for (var i = 0; i < entries.length && out.length < n; i++) {
            var p = entries[i].p;
            var slash = p.lastIndexOf('/');
            var name = slash >= 0 ? p.substring(slash + 1) : p;
            if (!name) continue;
            if (out.indexOf(name) < 0) out.push(name);
        }
        return out;
    }

    // Build a content-rich preview line like:
    //   "8 reads (README.md, package.json, …)  3 writes (foo.ts)  1 exec"
    // The point is to surface what the agent actually touched, not just
    // a count, so an operator can decide at a glance whether to expand
    // the strip for the full event list.
    function summarizeFsEvents(events) {
        if (!events.length) return '';
        var b = bucketizeFsEvents(events);
        function part(slot, singular, plural) {
            if (!slot.count) return '';
            var names = topBasenames(slot, 3);
            var head = slot.count + ' ' + (slot.count === 1 ? singular : plural);
            if (!names.length) return head;
            var more = Object.keys(slot.paths).length > names.length ? ', …' : '';
            return head + ' (' + names.join(', ') + more + ')';
        }
        var pieces = [
            part(b.read,  'read',   'reads'),
            part(b.write, 'write',  'writes'),
            part(b.del,   'delete', 'deletes'),
            part(b.exec,  'exec',   'execs'),
        ].filter(Boolean);
        if (b.other.count) pieces.push(b.other.count + ' other');
        return pieces.join('  •  ');
    }

    // Decide visual tone (color intensity) from the bucketized counts.
    // Deletes are the loudest signal (file removal), writes are
    // notable, read-only activity is gray plumbing. Returns both the
    // tight badge classes for the turn header and the wider strip
    // classes for the inline summary so the two stay visually
    // related — the strip reads as the badge expanded.
    function fsBadgeTone(b) {
        if (b.del.count > 0) {
            return {
                label:  'destructive',
                badge:  'bg-red-100 text-red-700 dark:bg-red-950/60 dark:text-red-300',
                strip:  'border-red-500 bg-red-50 text-red-900 dark:bg-red-950/30 dark:text-red-100',
            };
        }
        if (b.write.count > 0) {
            return {
                label:  'writes',
                badge:  'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300',
                strip:  'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-950/30 dark:text-amber-100',
            };
        }
        return {
            label:  'read-only',
            badge:  'bg-muted text-muted-foreground',
            strip:  'border-blue-400 bg-blue-50/60 text-blue-900 dark:bg-blue-950/30 dark:text-blue-100',
        };
    }

    // Group a flat event list by transaction id, preserving insertion
    // order of the first event per tx (so the timeline reads naturally).
    function groupByTx(events) {
        var groups = [];
        var byTx = {};
        events.forEach(function(e) {
            var tx = e.transaction_id || 0;
            if (!byTx.hasOwnProperty(tx)) {
                byTx[tx] = [];
                groups.push(tx);
            }
            byTx[tx].push(e);
        });
        return { order: groups, byTx: byTx };
    }

    function renderGroupedEvents(grouped) {
        var html = '';
        grouped.order.forEach(function(tx) {
            var list = grouped.byTx[tx];
            html += '<div class="mt-2"><div class="text-[10px] font-semibold text-muted-foreground mb-0.5">';
            if (tx) {
                html += '<a href="' + prefix + '/activity?kind=http#act-http-' + tx + '" class="hover:underline">tx #' + tx + '</a>';
            } else {
                html += 'unattributed';
            }
            html += ' &middot; ' + list.length + ' event' + (list.length === 1 ? '' : 's') + '</div>';
            list.forEach(function(e) { html += renderFsLine(e); });
            html += '</div>';
        });
        return html;
    }

    // Wire per-turn summary panels: for each turn element that lists a
    // set of tx ids in data-tx-ids, pick the matching events from the
    // conversation-wide list, render a header badge + collapsed
    // content-rich preview, and bind a click-to-expand handler. Turns
    // whose linked transactions have no attributed fs events stay
    // hidden so the conversation timeline doesn't grow empty rows.
    function populateTurnFsSummaries(allEvents) {
        var turns = document.querySelectorAll('#conv-detail [data-tx-ids]');
        turns.forEach(function(turnEl) {
            var raw = turnEl.getAttribute('data-tx-ids') || '';
            if (!raw) return;
            var ids = {};
            raw.split(',').forEach(function(s) { if (s) ids[s.trim()] = true; });
            var matching = allEvents.filter(function(e) { return ids[String(e.transaction_id || 0)]; });
            if (matching.length === 0) return;

            var b      = bucketizeFsEvents(matching);
            var tone   = fsBadgeTone(b);
            var panel  = turnEl.querySelector('.turn-fs-summary');
            var line   = turnEl.querySelector('.turn-fs-headline');
            var body   = turnEl.querySelector('.turn-fs-body');
            var chev   = turnEl.querySelector('.turn-fs-chevron');
            var toggle = turnEl.querySelector('.turn-fs-toggle');
            var badge  = turnEl.querySelector('.turn-fs-badge');
            var badgeT = turnEl.querySelector('.turn-fs-badge-text');

            // Header badge: always-visible chip in the turn header so
            // the operator notices fs activity while scrolling without
            // needing to look at the bottom of the turn.
            if (badge && badgeT) {
                badgeT.textContent = matching.length + ' fs';
                badge.className = 'turn-fs-badge inline-flex items-center gap-1 px-1.5 py-0.5 rounded font-medium ' + tone.badge;
                badge.setAttribute('title', 'Filesystem activity: ' + tone.label + ' — click for details');
                badge.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    if (body && body.classList.contains('hidden')) {
                        body.classList.remove('hidden');
                        if (chev) chev.style.transform = 'rotate(90deg)';
                    }
                    if (panel) panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                });
                badge.style.cursor = 'pointer';
            }

            if (!panel || !line || !body || !toggle) return;
            line.textContent = summarizeFsEvents(matching);
            body.innerHTML = renderGroupedEvents(groupByTx(matching));
            // Apply tone classes to the wrapper so reads (blue),
            // writes (amber), and deletes (red) read as distinct
            // bands in the timeline — the strip is no longer just
            // muted plumbing.
            panel.className = 'turn-fs-summary border-t border-l-4 text-xs ' + tone.strip;
            panel.classList.remove('hidden');
            toggle.addEventListener('click', function() {
                var open = body.classList.toggle('hidden');
                if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
            });
        });
    }

    fetch(prefix + '/api/conversations/' + encodeURIComponent(convID) + '/fsevents')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var body = document.getElementById('conv-fsevents-body');
            if (!body) return;
            var events = (data && data.events) || [];
            populateTurnFsSummaries(events);
            if (events.length === 0) {
                body.innerHTML = '<span class="text-muted-foreground">No filesystem events attributed to this conversation.</span>';
                return;
            }
            body.innerHTML = renderGroupedEvents(groupByTx(events));
        })
        .catch(function() {
            var body = document.getElementById('conv-fsevents-body');
            if (body) body.innerHTML = '<span class="text-red-600">Failed to load filesystem events.</span>';
        });
}

function toggleSection(sectionId) {
    var el = document.getElementById(sectionId);
    var icon = document.getElementById(sectionId + '-icon');
    if (el) {
        el.classList.toggle('hidden');
        if (icon) {
            icon.style.transform = el.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(90deg)';
        }
    }
}

// Toggle a single tool call card between collapsed and expanded
function toggleToolCall(card) {
    var body = card.querySelector('.tool-call-body');
    var chevron = card.querySelector('.tool-call-chevron');
    var isExpanded = card.dataset.toolExpanded === 'true';
    if (isExpanded) {
        body.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
        card.dataset.toolExpanded = 'false';
    } else {
        body.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
        card.dataset.toolExpanded = 'true';
    }
    updateToggleAllButton();
}

// Toggle all tool calls expanded/collapsed
function toggleAllTools() {
    var cards = document.querySelectorAll('#conv-detail .tool-call-card');
    if (cards.length === 0) return;
    // If any are collapsed, expand all; if all expanded, collapse all
    var anyCollapsed = false;
    cards.forEach(function(card) {
        if (card.dataset.toolExpanded !== 'true') anyCollapsed = true;
    });
    cards.forEach(function(card) {
        var body = card.querySelector('.tool-call-body');
        var chevron = card.querySelector('.tool-call-chevron');
        if (anyCollapsed) {
            body.classList.remove('hidden');
            chevron.style.transform = 'rotate(180deg)';
            card.dataset.toolExpanded = 'true';
        } else {
            body.classList.add('hidden');
            chevron.style.transform = 'rotate(0deg)';
            card.dataset.toolExpanded = 'false';
        }
    });
    updateToggleAllButton();
}

function updateToggleAllButton() {
    var btn = document.getElementById('toggle-all-tools-text');
    if (!btn) return;
    var cards = document.querySelectorAll('#conv-detail .tool-call-card');
    var allExpanded = true;
    cards.forEach(function(card) {
        if (card.dataset.toolExpanded !== 'true') allExpanded = false;
    });
    btn.textContent = allExpanded ? 'Collapse tools' : 'Expand tools';
}

// Toggle result expand (show all lines vs truncated)
function toggleResultExpand(btn) {
    var pre = btn.closest('div').nextElementSibling || btn.closest('div').querySelector('pre');
    if (!pre) {
        // Try sibling pre
        pre = btn.parentElement.querySelector('pre');
    }
    if (!pre) return;
    var isTruncated = pre.dataset.truncated === 'true';
    if (isTruncated) {
        pre.textContent = pre.dataset.fullContent;
        pre.style.maxHeight = '40rem';
        pre.dataset.truncated = 'false';
        btn.textContent = 'Show less';
    } else {
        // Re-truncate to 10 lines
        var lines = pre.dataset.fullContent.split('\n');
        pre.textContent = lines.slice(0, 10).join('\n') + '\n...';
        pre.style.maxHeight = '12rem';
        pre.dataset.truncated = 'true';
        btn.textContent = 'Show all';
    }
}

// Handle browser back/forward
window.addEventListener('popstate', function(e) {
    if (e.state && e.state.convId) {
        selectConversation(e.state.convId);
    } else {
        currentConvId = null;
        document.querySelectorAll('[data-conv-id]').forEach(function(el) {
            el.classList.remove('bg-muted');
        });
        document.getElementById('conv-detail').innerHTML =
            '<div class="flex items-center justify-center h-full text-muted-foreground">' +
            '<p class="text-sm">Select a conversation to view details</p></div>';
    }
});

// Auto-refresh on conversation update events
window.addEventListener('proxy:conversation-event', function() {
    if (convLive) {
        refreshConversations();
        if (currentConvId) {
            selectConversation(currentConvId);
        }
    } else {
        convPendingCount++;
        applyConvLiveStyle();
    }
});

// Initial load
applyConvLiveStyle();
refreshConversations();

// Restore from URL if conversation ID is present
(function() {
    var params = new URLSearchParams(window.location.search);
